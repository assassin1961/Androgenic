name: Deploy portfolio to GitHub Pages

# One-time setup: Repo → Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that, every push to the branch below
# publishes the site to https://assassin1961.github.io/Androgenic/

on:
  push:
    branches: ["claude/real-estate-portfolio-site-vxcdk6"]
    paths: ["portfolio/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio
      - id: deployment
        uses: actions/deploy-pages@v4
